<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greek Row</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first column. Resource HUD on top, the active page in the middle, tab bar at the bottom.
   One palette for the whole game; the canvas reads the same values from PAL in the script. */
:root{
  --bg:#0d1511;
  --panel:#16211b;
  --panel2:#1d2b23;
  --line:#2d4436;
  --ink:#f5f2e7;
  --muted:#a2b4a6;
  --dues:#4fd18b;
  --clout:#b48cff;
  --gems:#5ce1e6;
  --gold:#ffc83d;
  --gold-d:#b8860f;
  --danger:#ff6b5e;
  --danger-d:#a8362c;
  --pledge:#4aa8ff;
  --prank:#e85aa0;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#17261d 0%,var(--bg) 65%);background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:600;overflow:hidden;
  user-select:none;-webkit-user-select:none;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}

/* resource HUD */
.hud{display:flex;gap:6px;align-items:stretch;flex:none}
.res{flex:1;min-width:0;display:flex;gap:7px;align-items:center;background:linear-gradient(#1b2920,#141f18);border:1px solid var(--line);border-radius:12px;padding:6px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.res.gems,.res.rep{flex:.72}
.coin{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:12px;color:#0d1511;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35)}
.res.dues .coin{background:var(--dues)} .res.clout .coin{background:var(--clout)}
.gem{width:20px;height:22px;flex:none;background:linear-gradient(135deg,#c2fbfc 0%,#5ce1e6 45%,#2aa4b0 100%);clip-path:polygon(50% 0,100% 36%,50% 100%,0 36%)}
.star{width:22px;height:22px;flex:none;background:var(--gold);clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%)}
.res .v{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.res b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res b small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:700}
.bar{height:5px;border-radius:3px;background:#0f1914;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .35s ease-out}}
.res.dues .bar span{background:var(--dues)} .res.clout .bar span{background:var(--clout)}
.ahud{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;gap:10px;flex:none}
.ahud .name{font-family:var(--display);font-size:19px;color:var(--danger)}
.ahud .sub{font-size:13px;color:var(--muted)}
.ahud .right{text-align:right;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px}
.stars .off{color:#3a4a3e}

/* pages */
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){.page.enter{animation:pageIn .24s cubic-bezier(.2,.8,.2,1)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex:none}
.ptitle h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.01em}
.ptitle span{color:var(--muted);font-size:14px}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.sect{font-family:var(--display);font-size:16px;color:var(--muted);margin-top:6px}

/* board */
.boardWrap{position:relative;flex:1 1 0;min-height:150px}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;border-radius:16px;touch-action:none;box-shadow:0 0 0 2px var(--line),0 12px 28px rgba(0,0,0,.45)}

/* base page */
#panel{height:128px;flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
#panel h2 .lv{color:var(--gold);font-size:14px;margin-left:6px}
#panel p{margin:0;color:var(--muted);line-height:1.3;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.stats span{color:var(--muted)} .stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;flex:none}
.actions .btn{padding:13px 4px;position:relative}
.badge{position:absolute;top:-7px;right:-5px;background:var(--danger);color:#fff;border-radius:9px;font-family:var(--display);font-size:11px;padding:3px 6px;box-shadow:0 0 0 2px var(--bg)}

/* buttons: one shape, three colors */
.btn{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;
  color:#2a1c00;background:linear-gradient(#ffdc6e,#ffc83d 55%,#f2ad1d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 0 var(--gold-d),0 6px 12px rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(255,255,255,.35);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .08s,box-shadow .08s,filter .15s}}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 var(--gold-d),0 2px 4px rgba(0,0,0,.3)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{color:var(--ink);background:linear-gradient(#2c4033,#223328);text-shadow:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 0 #0f1813,0 6px 12px rgba(0,0,0,.25)}
.btn.ghost:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 #0f1813}
.btn.red{color:#fff;background:linear-gradient(#ff8d81,#ff6b5e 55%,#e8473a);text-shadow:0 1px 0 rgba(0,0,0,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 var(--danger-d),0 6px 12px rgba(0,0,0,.3)}
.btn.red:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 var(--danger-d)}
.btn.big{font-size:22px;padding:16px;border-radius:14px}
.btn[disabled]{filter:grayscale(.8);opacity:.45;pointer-events:none}
.cost{font-family:var(--body);font-weight:800;font-size:13px;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.2);text-shadow:none}
.btn .cost.dues{color:#0e4a25} .btn .cost.clout{color:#3b1a6b}
.btn.ghost .cost.dues{color:var(--dues)} .btn.ghost .cost.clout{color:var(--clout)}

/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px;flex:none}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-family:var(--display);font-size:14px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tab{transition:background .15s,color .15s}}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.tab[aria-current=page]{background:linear-gradient(#2f4637,#233629);color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tab[aria-current=page]::before{content:"";position:absolute;top:-5px;left:32%;right:32%;height:3px;border-radius:2px;background:var(--gold)}

/* shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gift{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;background:linear-gradient(#1f2e25,#17231c);border:1px solid var(--line);border-radius:16px;cursor:pointer;color:var(--ink);font-family:var(--body);font-weight:600}
@media (prefers-reduced-motion:no-preference){.gift{transition:transform .12s,border-color .12s}}
.gift:hover{transform:translateY(-2px);border-color:#46684f}
.gift:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.gift img{width:76px;height:76px}
.gift b{font-family:var(--display);font-weight:400;font-size:17px}
.gift .d{font-size:13px;color:var(--muted);text-align:center;line-height:1.25;min-height:2.5em}
.price{display:inline-flex;gap:6px;align-items:center;font-family:var(--display);font-size:16px;padding:5px 11px;border-radius:999px;background:#0e1712;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.price.gems{color:var(--gems)} .price.dues{color:var(--dues)}
.price .gem{display:inline-block;width:14px;height:16px} .price .coin{width:16px;height:16px;font-size:9px}
.gift.poor .price{opacity:.55}

/* troops */
.trow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--panel2);border:2px solid transparent}
.trow.sel{border-color:var(--gold);background:linear-gradient(#24352a,#1d2b23)}
.trow.locked{filter:grayscale(1);opacity:.55}
.trow img,.trow .pi{width:64px;height:64px;border-radius:12px;background:#22352a}
.trow .pi{display:grid;place-items:center;background:var(--prank);font-family:var(--display);font-size:24px;color:#fff}
.trow h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px}
.trow h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:4px}
.trow p{margin:2px 0 4px;font-size:13px;color:var(--muted);line-height:1.25}
.tstats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:1px 12px;font-size:13px;color:var(--muted)}
.tstats b{color:var(--ink);font-weight:800}
.tstats span{white-space:nowrap}
.tact{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:92px}
.tact .btn{padding:8px 10px;font-size:14px}
@media (max-width:520px){
  .res b small{display:none}
  .trow{grid-template-columns:52px 1fr}
  .trow img,.trow .pi{width:52px;height:52px}
  .tact{grid-column:1/-1;flex-direction:row}
  .tact>*{flex:1}
}
.lockreq{font-family:var(--display);font-size:13px;color:var(--ink);background:#0e1712;border-radius:9px;padding:8px;text-align:center;line-height:1.2}

/* lobby */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.3}
.lobbyInfo{flex:none;display:flex;flex-direction:column;gap:8px;max-height:52%;overflow:auto}
.opp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opp b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--danger)}
.opp .m{display:block;color:var(--muted);font-size:13px}
.opp .btn{flex:none;white-space:nowrap}
.lo{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.lo .slot{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.lo .slot img{width:46px;height:46px;border-radius:50%;background:#22352a;border:2px solid var(--line)}
.lo .slot b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--ink)}
.lo .slot.empty{opacity:.45}
.players{display:flex;flex-direction:column;gap:6px}
.player{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:10px;background:var(--panel2);font-size:14px}
.player b{font-family:var(--display);font-weight:400;font-size:15px}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#0e1712;color:var(--muted)}
.tag.ok{color:var(--dues)}

.pbar{flex:none;display:flex;align-items:center;gap:10px;background:linear-gradient(#22352a,#1a281f);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:#2a1c00;background:linear-gradient(#ffdc6e,#f2ad1d);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.who b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.who span{color:var(--muted);font-size:13px}

/* match */
#matchPanel{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted);font-size:14px;line-height:1.3}
.troops{display:flex;gap:8px;overflow-x:auto;flex:none;padding:4px 0 2px}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#1f2e25,#17231c);border:2px solid var(--line);border-radius:14px;padding:6px 10px;min-width:68px;cursor:pointer;color:var(--ink);font-family:var(--body);font-weight:700}
@media (prefers-reduced-motion:no-preference){.chip{transition:transform .1s,border-color .1s}}
.chip.on{border-color:var(--gold);transform:translateY(-3px)}
.chip .g{width:34px;height:34px;border-radius:50%;background:var(--pledge);display:grid;place-items:center;font-family:var(--display);font-size:14px;color:#fff;border:2px solid #1c4f86}
.chip .n{font-size:13px}
.chip .c{font-family:var(--display);font-size:13px;color:var(--gold)}
.chip.prank .g{background:var(--prank);border-color:#7a1d4b}
.chip.rager{border-color:#5a4a1a}
.chip.rager .g{background:conic-gradient(var(--gold) calc(var(--h,0)*1%),#2a3a2e 0);border-color:var(--gold-d);color:#1a1405}
.chip.rager.full{border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
.chip.rager.live .g{background:var(--prank);border-color:#fff;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,200,61,.35)}}
@media (prefers-reduced-motion:reduce){.chip.rager.full{animation:none}}

/* sheets, rival log, build list */
.logrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.logrow b{font-family:var(--display);font-weight:400;font-size:17px}
.logrow>div>span{display:block;color:var(--muted);font-size:13px}
.logrow .won{color:var(--dues)} .logrow .lost{color:var(--danger)}
.sheet{position:fixed;inset:0;background:rgba(5,9,6,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.sheet .card{width:100%;max-width:520px;max-height:80%;overflow:auto;padding:14px;gap:10px;border-radius:18px;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]) .card{animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2)}
.item .sw{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:14px;color:#fff}
.item .t{min-width:0}
.item .t b{display:block;font-size:16px;font-weight:800}
.item .t span{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.lock{color:var(--muted);font-size:13px;font-weight:700;text-align:right}
.confirm{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.confirm img{width:110px;height:110px}
.confirm .bal{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.confirm .bal b{color:var(--ink)}
.confirm .warn{color:var(--danger);font-size:14px}
.big-stars{font-size:44px;color:var(--gold);letter-spacing:6px;text-align:center}
.big-stars .off{color:#33443a}
.loot{display:flex;justify-content:center;gap:18px;font-family:var(--display);font-size:19px;flex-wrap:wrap}
.loot .d{color:var(--dues)} .loot .c{color:var(--clout)} .loot .g{color:var(--gems)}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a110d;border:1px solid var(--line);
  color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;font-size:15px;max-width:min(90vw,380px);text-align:center;z-index:30;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}

/* placeholder ad: deliberately styled like a light web ad, not like the game */
.ad{position:fixed;right:16px;top:50%;width:200px;z-index:15;background:#fffaf0;color:#222;border:1px solid #d9d2c0;border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:6px;font-family:system-ui,sans-serif;font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translateY(-50%)}
@media (prefers-reduced-motion:no-preference){.ad{animation:adIn .4s ease-out}}
@keyframes adIn{from{opacity:0;transform:translate(40px,-50%)}}
.ad .adtag{font-size:10px;font-weight:700;color:#7a7466;letter-spacing:.08em}
.ad .adx{position:absolute;top:6px;right:6px;width:22px;height:22px;border:0;border-radius:50%;background:#ece5d3;color:#555;cursor:pointer;font-size:11px;line-height:1}
.ad .adart{height:84px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ad b{font-size:15px}
.ad p{margin:0;font-size:13px;color:#555;line-height:1.3}
.ad .adcta{border:0;border-radius:8px;padding:8px;font-weight:700;font-size:13px;cursor:pointer;color:#fff}
@media (max-width:899px){
  .ad{top:auto;bottom:calc(205px + env(safe-area-inset-bottom,0px));transform:none;width:150px;padding:8px;gap:4px}
  @keyframes adIn{from{opacity:0;transform:translateX(40px)}}
  .ad .adart{height:44px;font-size:18px}
  .ad p{display:none}
}
</style>

<div id="app">
  <div class="hud" id="hud">
    <div class="res dues"><div class="coin">D</div><div class="v"><b id="duesV">0</b><div class="bar"><span id="duesB"></span></div></div></div>
    <div class="res clout"><div class="coin">C</div><div class="v"><b id="cloutV">0</b><div class="bar"><span id="cloutB"></span></div></div></div>
    <div class="res gems"><div class="gem"></div><div class="v"><b id="gemsV">0</b></div></div>
    <div class="res rep"><div class="star"></div><div class="v"><b id="repV">0</b></div></div>
  </div>
  <div class="ahud" id="ahud" hidden>
    <div><div class="name" id="rName">ΚΑΟΣ</div><div class="sub" id="rSub">Level 1 chapter</div></div>
    <div class="right"><div id="rTime">2:30</div><div><span class="stars" id="rStars"></span> <span id="rPct">0%</span></div></div>
  </div>
  <main id="view">
    <section class="page" id="pg-base" aria-label="Base">
      <div class="boardWrap" id="wrap-base"><canvas id="board" aria-label="Chapter lawn"></canvas></div>

(()=>{

const GRID=18,LOG=360,TS=LOG/GRID;

// same values as the CSS tokens, for things drawn on the canvas

const ftime=s=>{s=Math.max(0,Math.ceil(s));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m '+(s%60?s%60+'s':'');return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'};

/* ---------- content ---------- */
const B={
  chapter:{name:'Chapter House',size:4,res:'dues',cost:[0,1000,4000,12000,30000],time:[0,60,240,600,1200],hp:[1600,2200,2900,3700,4600],cap:[1000,2000,4000,7000,10000],max:[1,1,1,1,1],color:'#7a2236',desc:'Your headquarters. Its level sets how far every other building can go.'},

const T={

  heavy:{name:'Heavyweight',house:5,cost:150,hp:1100,dmg:95,spd:.6,range:.65,rate:2,r:.56,glyph:'H',pref:'def',unlock:1,desc:'Slow and huge. Walks straight to defenses and soaks the damage. Every hit lands hard.'},
  pcp:{name:'Pledge Class President',house:6,cost:200,hp:900,dmg:50,spd:1.3,range:.7,rate:1.1,r:.42,glyph:'PC',max:1,unlock:1,desc:'Leads the pledge class. Pledges, Lightweights and Gargoyle Pledges near the PCP hit 50% harder and move faster. One per army.'},

};
const P={
  pizza:{name:'Pizza Drop',cost:90,glyph:'Z',r:2.5,unlock:1,desc:'Free pizza. Heals your troops standing in the zone for 4 seconds.'},
  airhorn:{name:'Air Horn',cost:140,glyph:'A',r:3,unlock:2,desc:'Blasts a zone. Defenses inside go deaf and stop firing for 5 seconds.'},
  glitter:{name:'Glitter Bomb',cost:180,glyph:'G',r:2.2,unlock:3,desc:'Ruins everything nearby. Big damage to buildings, wrecks hedges.'},
};
const RAGER_TIME=8,AURA=2.8;
const GREEK='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
const CFG=window.GR_CONFIG;
if(!CFG)throw new Error('config.js did not load. It must sit next to index.html.');
const PLAYER_NAME='James M';
const LOADOUT_MAX=5,DEFAULT_LOADOUT=['swarm','balloon','light','gargoyle'];

/* ---------- save ---------- */
const KEY='greek-row-save-v1';
function fresh(){
  const t=now();let id=1;
  const mk=(type,x,y)=>({id:id++,type,x,y,lvl:1,busy:null,last:t-6*60000});
  const bs=[mk('chapter',7,7),mk('duesbox',3,3),mk('cloutbooth',13,3),mk('annex',3,13),mk('tent',13,12),mk('balloon',8,12)];
  return{dues:500,clout:500,rep:0,letters:'ΠΛΔ',gems:40,army:{swarm:8,balloon:3},loadout:[...DEFAULT_LOADOUT],pranks:{},log:[],seen:t,buildings:bs,nextId:id};
}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!Array.isArray(s.buildings))s=fresh();
  s.pranks=s.pranks||{};s.log=s.log||[];s.seen=s.seen||now();
  delete s.map;
  if(typeof s.gems!=='number')s.gems=40;
  if(!Array.isArray(s.layoutBag))s.layoutBag=[];
  s.loadout=(Array.isArray(s.loadout)?s.loadout:DEFAULT_LOADOUT).filter(k=>T[k]).slice(0,LOADOUT_MAX);
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
let G=load();

/* ---------- economy helpers ---------- */
const chapter=()=>G.buildings.find(b=>b.type==='chapter');
const CL=()=>Math.max(1,chapter().lvl);
function cap(){let c=B.chapter.cap[CL()-1];for(const b of G.buildings)if(b.type==='annex'&&b.lvl>0)c+=B.annex.cap[b.lvl-1];return c}
const busyCount=()=>G.buildings.filter(b=>b.busy).length;
const count=t=>G.buildings.filter(b=>b.type===t).length;
const maxCount=t=>B[t].max[CL()-1];
function stored(b){const d=B[b.type];if(!d.gives||b.lvl<1||b.busy||b.last==null)return 0;return Math.min(d.hold[b.lvl-1],(now()-b.last)/60000*d.rate[b.lvl-1])}
function armyUsed(o=G.army){let n=0;for(const k in o)n+=(o[k]||0)*T[k].house;return n}
function prankUsed(){let n=0;for(const k in G.pranks)n+=G.pranks[k]||0;return n}
const closet=()=>G.buildings.find(b=>b.type==='closet'&&b.lvl>0);
function prankCap(){const c=closet();return c?B.closet.slots[c.lvl-1]:0}
function armyCap(){let c=0;for(const b of G.buildings)if(b.type==='tent'&&b.lvl>0)c+=B.tent.housing[b.lvl-1];return c}
function fits(x,y,s,list,ignore){
  if(x<0||y<0||x+s>GRID||y+s>GRID)return false;
  for(const o of list){if(o===ignore||o.alive===false)continue;const os=B[o.type].size;if(x<o.x+os&&x+s>o.x&&y<o.y+os&&y+s>o.y)return false}
  return true;
}
function collect(b,quiet){
  const d=B[b.type],r=d.gives,amt=Math.floor(stored(b));
  if(amt<1)return 0;
  const take=Math.min(amt,Math.max(0,Math.floor(cap()-G[r])));
  if(take<=0){if(!quiet)toast(`${resName(r)} storage is full. Build or upgrade a Treasury Annex.`);return 0}
  G[r]+=take;b.last=now()-((amt-take)/d.rate[b.lvl-1])*60000;
  floatText(b,'+'+take,r==='dues'?'#4fd18b':'#b48cff');save();return take;
}
function upgrade(b){
  const d=B[b.type],nl=b.lvl+1;
  if(nl>5)return;
  if(b.type!=='chapter'&&nl>CL()){toast(`Upgrade the Chapter House to level ${nl} first.`);return}
  const cost=d.cost[nl-1];
  if(G[d.res]<cost){toast(`You need ${fmt(cost-G[d.res])} more ${resName(d.res)}.`);return}
  const time=d.time[nl-1];
  if(time>0&&busyCount()>=2){toast('Both builders are busy. Wait for one to finish.');return}
  if(d.gives)collect(b,true);
  G[d.res]-=cost;
  if(time>0){b.busy={until:now()+time*1000,to:nl};if(d.gives)b.last=null}else b.lvl=nl;
  save();renderAll();
}
function placeNew(type,x,y){
  const d=B[type],cost=d.cost[0],time=d.time[0];
  if(count(type)>=maxCount(type)){toast(`You've built the most ${d.name}s allowed at this Chapter level.`);return false}
  if(G[d.res]<cost){toast(`You need ${fmt(cost-G[d.res])} more ${resName(d.res)}.`);return false}
  if(time>0&&busyCount()>=2){toast('Both builders are busy. Wait for one to finish.');return false}
  if(!fits(x,y,d.size,G.buildings)){toast("That spot is taken.");return false}
  G[d.res]-=cost;
  G.buildings.push({id:G.nextId++,type,x,y,lvl:time>0?0:1,busy:time>0?{until:now()+time*1000,to:1}:null,last:time>0?null:now()});
  save();return true;
}
function finishBuilds(){
  const t=now();let ch=false;
  for(const b of G.buildings)if(b.busy&&b.busy.until<=t){b.lvl=b.busy.to;if(B[b.type].gives)b.last=b.busy.until;b.busy=null;ch=true;floatText(b,'Done!','#ffc83d')}
  if(ch){save();renderAll()}
}

/* ---------- rivals raiding you ---------- */
function defenseScore(){
  let s=CL()*4;
  for(const b of G.buildings){
    if(b.lvl<1)continue;const d=B[b.type];
    if(d.def)s+=d.dmg[b.lvl-1]/d.rate*(d.splash?1.5:1)*(d.stun?1.8:1)*(d.range/4);
    else if(b.type==='hedge')s+=b.lvl*.6;
  }
  return s;
}
function randName(){let n;do{n=[0,0,0].map(()=>GREEK[Math.random()*GREEK.length|0]).join('')}while(n===G.letters);return n}
function rivalRaid(){
  const L=clamp(CL()+(Math.random()<.35?1:0)-(Math.random()<.3?1:0),1,5);
  const ratio=defenseScore()/(30*Math.pow(L,1.4)*(.8+Math.random()*.4));
  const stars=ratio>=1.6?0:ratio>=1?1:ratio>=.6?2:3,frac=[0,.06,.12,.2][stars];
  const lost={dues:Math.floor(G.dues*frac),clout:Math.floor(G.clout*frac)};
  G.dues-=lost.dues;G.clout-=lost.clout;
  const rep=stars?-stars*3:6;G.rep=Math.max(0,G.rep+rep);
  if(!stars)G.gems+=1;
  const e={id:now()+Math.random(),name:randName(),lvl:L,stars,lost,rep,t:now(),avenged:false,fresh:true};
  G.log.unshift(e);G.log=G.log.slice(0,10);
  return e;
}
function processAway(){
  const away=now()-(G.seen||now());G.seen=now();
  if(away<8*60000)return;
  let n=(Math.random()<.75?1:0)+(away>2*3600000&&Math.random()<.6?1:0);
  if(!n)return;
  for(let i=0;i<n;i++)rivalRaid();
  save();
  if(Match.state==='Lobby'&&$('sheet').hidden)openRivals(true);else renderAll();
}

/* ---------- state ---------- */
/* ---------- match flow ----------
   Match.state is the one owner of where the player is:
   Lobby (menu pages) -> Ready (countdown) -> InMatch -> Results -> Lobby.
   go() refuses any other transition, so double clicks and late timers are no-ops. */
const Match={
  state:'Lobby',
  edges:{Lobby:['Ready'],Ready:['InMatch','Lobby'],InMatch:['Results'],Results:['Lobby']},
  go(to){if(!this.edges[this.state].includes(to))return false;this.state=to;return true},
};
const inMenus=()=>Match.state==='Lobby';
let page='base';            // which menu page shows while in the Lobby state: base | shop | troops | lobby
let ui={sel:null,place:null,move:false,ghost:null};
let A=null;                 // the lobby's opponent, and the match state once Ready is pressed. Rebuilt for every match.
let floats=[];
const cv=$('board');let ctx=cv.getContext('2d');let scale=1;

/* ---------- rival bases ----------
   Layouts are data in layouts.js. Each one is parsed into slots per building type, sorted so the
   slots nearest the Chapter House come first. A level-L rival fills the first rivalCount(type,L) slots,
   so every layout has the same buildings at a given level and only the arrangement differs.
   Buildings don't block movement and hedges can be broken (Gargoyles fly over them), so a layout is
   reachable as long as there is open lawn to drop troops on; validation checks that room. */
const LAYOUT_LETTERS={C:'chapter',B:'balloon',N:'nerf',S:'speaker',D:'duesbox',L:'cloutbooth',A:'annex',K:'closet',T:'tent',h:'hedge'};
const BUILD_ORDER=['chapter','balloon','nerf','speaker','duesbox','cloutbooth','annex','closet','tent','hedge'];
const rivalCount=(type,L)=>type==='chapter'||type==='tent'?1:type==='hedge'?Math.min(CFG.layouts.maxHedges,B.hedge.max[L-1]+(L>=3?6:0)):B[type].max[L-1];
function layoutPlan(slots,L){const out=[];for(const t of BUILD_ORDER)for(const p of(slots[t]||[]).slice(0,rivalCount(t,L)))out.push({type:t,x:p.x,y:p.y});return out}
function parseLayout(def){
  const errs=[],grid=def.grid,slots={};
  if(!Array.isArray(grid)||grid.length!==GRID||grid.some(r=>typeof r!=='string'||r.length!==GRID))return{errs:[`grid must be ${GRID} rows of ${GRID} characters`],slots};
  const taken=[...Array(GRID)].map(()=>Array(GRID).fill(false));
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const ch=grid[y][x];if(ch==='.'||taken[y][x])continue;
    const type=LAYOUT_LETTERS[ch];
    if(!type){errs.push(`unknown letter "${ch}" at ${x},${y}`);continue}
    const s=B[type].size;let ok=x+s<=GRID&&y+s<=GRID;
    for(let yy=y;ok&&yy<y+s;yy++)for(let xx=x;xx<x+s;xx++)if(grid[yy][xx]!==ch||taken[yy][xx])ok=false;
    if(!ok){errs.push(`${B[type].name} at ${x},${y} is not a clean ${s}x${s} square`);for(let yy=y;yy<Math.min(GRID,y+s);yy++)for(let xx=x;xx<Math.min(GRID,x+s);xx++)if(grid[yy][xx]===ch)taken[yy][xx]=true;continue}
    for(let yy=y;yy<y+s;yy++)for(let xx=x;xx<x+s;xx++)taken[yy][xx]=true;
    (slots[type]=slots[type]||[]).push({x,y});
  }
  const chs=slots.chapter||[];
  if(chs.length!==1){errs.push(`needs exactly one Chapter House, found ${chs.length}`);return{errs,slots}}
  const cx=chs[0].x+B.chapter.size/2,cy=chs[0].y+B.chapter.size/2;
  for(const t in slots){const h=B[t].size/2;slots[t].sort((a,b)=>Math.hypot(a.x+h-cx,a.y+h-cy)-Math.hypot(b.x+h-cx,b.y+h-cy)||a.y-b.y||a.x-b.x)}
  for(const t of BUILD_ORDER){const need=rivalCount(t,5),have=(slots[t]||[]).length;if(have<need)errs.push(`needs ${need} ${B[t].name} slot${need>1?'s':''}, has ${have}`)}
  if(!errs.length){
    const open=forbidGrid(layoutPlan(slots,5)).flat().filter(f=>!f).length;
    if(open<CFG.layouts.minDeployTiles)errs.push(`leaves ${open} open tiles to drop troops when fully built, needs ${CFG.layouts.minDeployTiles}`);
  }
  return{errs,slots};
}
const LAYOUT_LIST=(window.GR_LAYOUTS||[]).flatMap(def=>{
  const{errs,slots}=parseLayout(def);
  if(errs.length){console.error(`Layout "${def.id}" left out of the rotation:\n  `+errs.join('\n  '));return[]}
  return[{id:def.id,name:def.name,slots}];
});
if(!LAYOUT_LIST.length)throw new Error('No valid CPU base layouts. Check layouts.js and the console errors above.');
// Shuffled bag: every layout comes up once before any repeats. `avoid` holds ids that must not come
// next (the layout just played, and one being skipped), unless nothing else is left.
function pickLayout(avoid=[]){
  const ids=LAYOUT_LIST.map(l=>l.id);
  G.layoutBag=G.layoutBag.filter(id=>ids.includes(id));
  if(!G.layoutBag.length){G.layoutBag=[...ids];for(let i=G.layoutBag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[G.layoutBag[i],G.layoutBag[j]]=[G.layoutBag[j],G.layoutBag[i]]}}
  let i=G.layoutBag.findIndex(id=>!avoid.includes(id));
  if(i<0)i=G.layoutBag.findIndex(id=>id!==G.lastLayout);
  if(i<0)i=0;
  const id=G.layoutBag.splice(i,1)[0];save();
  return LAYOUT_LIST.find(l=>l.id===id);
}
function rivalBase(force,layout){
  const cl=CL(),L=force?force.lvl:clamp(cl+(Math.random()<.3?1:0)-(Math.random()<.25?1:0),1,5);
  const name=force?force.name:randName();
  const lv=()=>clamp(L-(Math.random()<.4?1:0),1,5);
  const bs=layoutPlan(layout.slots,L).map(({type,x,y})=>{const l=type==='chapter'?L:lv(),hp=B[type].hp[l-1];return{type,x,y,lvl:l,hp,max:hp,cd:Math.random()*1.5,alive:true,aim:Math.random()*6.28}});
  const k=.8+Math.random()*.4,bonus=force?force.lost:{dues:0,clout:0};
  return{name,lvl:L,layout:layout.id,layoutName:layout.name,buildings:bs,loot:{dues:Math.round((250+L*L*230)*k)+bonus.dues,clout:Math.round((250+L*L*230)*(1.6-k))+bonus.clout}};
}
function forbidGrid(bs){
  const g=[...Array(GRID)].map(()=>Array(GRID).fill(false));
  for(const b of bs){const s=B[b.type].size;for(let y=b.y-1;y<=b.y+s;y++)for(let x=b.x-1;x<=b.x+s;x++)if(x>=0&&y>=0&&x<GRID&&y<GRID)g[y][x]=true}
  return g;
}
const inLoadout=()=>G.loadout.filter(k=>CL()>=T[k].unlock);
function nextSel(){const t=inLoadout().find(k=>(G.army[k]||0)>0);if(t)return t;const p=Object.keys(P).find(k=>(G.pranks[k]||0)>0);return p?'p:'+p:null}
function findOpponent(rev){
  // a lobby opponent that is being replaced was never played, so its layout goes back in the bag
  const skipped=A&&inMenus()?A.base.layout:null;
  if(skipped)G.layoutBag.push(skipped);
  const base=rivalBase(rev,pickLayout([G.lastLayout,skipped]));
  A={base,bs:base.buildings,units:[],projs:[],fx:[],zones:[],t:CFG.match.duration,sel:null,deployed:0,lost:0,pct:0,stars:0,chapterDown:false,hype:0,rager:0,
    revenge:rev||null,forbid:forbidGrid(base.buildings),readyT:0,endIn:null,result:null};
}
// Lobby -> Ready: the Ready button. A second press while Ready is already running is refused by Match.go.
function startMatch(){
  if(!inMenus())return;
  if(!inLoadout().some(k=>(G.army[k]||0)>0)){toast('None of your selected troops are recruited. Pick or recruit some on the Troops page.');return}
  if(!Match.go('Ready'))return;
  if(!A)findOpponent();
  A.sel=nextSel();A.readyT=CFG.match.readySeconds;
  G.lastLayout=A.base.layout;save();
  if(G.hypeStart){A.hype=50;G.hypeStart=false;save()}
  ui={sel:null,place:null,move:false,ghost:null};renderAll();
}
// Ready -> InMatch once the countdown runs out
function tickReady(dt){
  A.readyT-=dt;
  if(A.readyT<=0&&Match.go('InMatch'))renderAll();
}
// Results -> Lobby. Drops every piece of the finished match so the next one starts clean.
function returnToLobby(){
  if(!Match.go('Lobby'))return;
  stopHold();A=null;floats=[];holdPos=null;
  ui={sel:null,place:null,move:false,ghost:null};
  closeSheet();page='lobby';renderAll();
}

/* ---------- raid simulation ---------- */
const center=b=>{const s=B[b.type].size;return{x:b.x+s/2,y:b.y+s/2}};
function rectDist(px,py,b){const s=B[b.type].size,cx=clamp(px,b.x,b.x+s),cy=clamp(py,b.y,b.y+s);return{d:Math.hypot(px-cx,py-cy),cx,cy}}
function pickTarget(u){
  const alive=A.bs.filter(b=>b.alive&&b.type!=='hedge');
  let pool=alive;
  if(T[u.k].pref==='def'){const d=alive.filter(b=>B[b.type].def);if(d.length)pool=d}
  if(T[u.k].pref==='loot'){const d=alive.filter(isLoot);if(d.length)pool=d}
  let best=null,bd=1e9;
  for(const b of pool){const{d}=rectDist(u.x,u.y,b);if(d<bd){bd=d;best=b}}
  return best;
}
const isLoot=b=>!!B[b.type].gives||b.type==='annex';
function hedgeAt(x,y,r){for(const b of A.bs)if(b.alive&&b.type==='hedge'&&rectDist(x,y,b).d<r*.9)return b;return null}
function damageB(b,d){
  if(!b.alive)return;
  b.hp-=d;b.hit=.16;
  if(b.hp<=0){
    b.hp=0;b.alive=false;b.died=tick();const c=center(b);
    A.fx.push({type:'boom',x:c.x,y:c.y,t:.7,max:.7});
    if(b.type==='chapter')A.chapterDown=true;
    const all=A.bs.filter(o=>o.type!=='hedge'),down=all.filter(o=>!o.alive).length;
    if(b.type!=='hedge'&&A.rager<=0){const was=A.hype;A.hype=Math.min(100,A.hype+100/Math.max(3,all.length*.3));if(was<100&&A.hype>=100){toast('Hype is maxed. Throw a Rager!');renderBottom()}}
    A.pct=Math.floor(down/all.length*100);
    A.stars=A.pct===100?3:(A.pct>=50?1:0)+(A.chapterDown?1:0);
    A.forbid=forbidGrid(A.bs.filter(o=>o.alive));
    if(A.pct===100&&A.endIn==null)A.endIn=CFG.match.endDelay;
  }
}
function castPrank(k,x,y){
  if(!(G.pranks[k]>0)){toast(`No ${P[k].name}s left.`);return}
  const p=P[k],lv=closet()?closet().lvl:1;
  G.pranks[k]--;
  if(k==='pizza')A.zones.push({k,x,y,r:p.r,t:4,max:4});
  else if(k==='airhorn'){A.zones.push({k,x,y,r:p.r,t:.6,max:.6});for(const b of A.bs)if(b.alive&&B[b.type].def&&rectDist(x,y,b).d<p.r)b.stun=5}
  else{A.zones.push({k,x,y,r:p.r,t:.8,max:.8});const dmg=180+lv*100;for(const b of A.bs)if(b.alive&&rectDist(x,y,b).d<p.r)damageB(b,b.type==='hedge'?dmg*4:dmg)}
  if(!(G.pranks[k]>0))A.sel=nextSel();
  renderBottom();
}
function throwRager(){
  if(Match.state!=='InMatch')return;
  if(A.rager>0)return;
  if(A.hype<100){toast(`Hype is at ${Math.floor(A.hype)}%. Knock down buildings to build it up.`);return}
  if(!A.units.length){toast('Get some troops on the lawn first.');return}
  A.hype=0;A.rager=RAGER_TIME;toast('RAGER! Troops hit harder and move faster.');renderBottom();
}
function deployAt(x,y){
  if(Match.state!=='InMatch'||!A.sel)return;
  if(A.sel.startsWith('p:'))return castPrank(A.sel.slice(2),x,y);
  const k=A.sel;
  if(!(G.army[k]>0)){toast(`No ${T[k].name}s left. Pick another troop.`);return}
  const tx=Math.floor(x),ty=Math.floor(y);
  if(tx<0||ty<0||tx>=GRID||ty>=GRID)return;
  if(A.forbid[ty][tx]){if(!A.warned||now()-A.warned>1500){A.warned=now();toast('Too close to their buildings. Drop troops in the open lawn.')}return}
  const t=T[k];
  A.units.push({k,x,y,hp:t.hp,max:t.hp,cd:.4,stun:0,tgt:null,wall:null,seed:Math.random(),dir:0,born:tick()});
  A.fx.push({type:'ring',x,y,r:.55,t:.3,max:.3,color:'#fff3c4'});
  G.army[k]--;A.deployed++;
  if(G.army[k]<=0)A.sel=nextSel();
  renderBottom();
}
function stepRaid(dt){
  A.t-=dt;
  const wasRager=A.rager>0;if(A.rager>0)A.rager-=dt;
  if(wasRager&&A.rager<=0)renderBottom();
  const spdM=A.rager>0?1.45:1,dmgM=A.rager>0?1.6:1;
  for(const z of A.zones){z.t-=dt;if(z.k==='pizza')for(const u of A.units)if(Math.hypot(u.x-z.x,u.y-z.y)<z.r)u.hp=Math.min(u.max,u.hp+u.max*.14*dt)}
  A.zones=A.zones.filter(z=>z.t>0);
  const pcps=A.units.filter(u=>u.k==='pcp');
  for(const u of A.units){
    const t=T[u.k];
    u.moving=false;
    u.buff=!!t.pledge&&pcps.some(p=>Math.hypot(p.x-u.x,p.y-u.y)<AURA);
    const bm=u.buff?1.5:1;
    if(u.stun>0){u.stun-=dt;continue}
    u.cd-=dt;
    if(u.wall&&!u.wall.alive)u.wall=null;
    if(!u.tgt||!u.tgt.alive)u.tgt=pickTarget(u);
    const tgt=u.wall||u.tgt;if(!tgt)continue;
    const{d,cx,cy}=rectDist(u.x,u.y,tgt);
    if(d>t.range){
      const dx=cx-u.x,dy=cy-u.y,n=Math.hypot(dx,dy)||.01,sp=t.spd*spdM*(u.buff?1.15:1)*dt,nx=u.x+dx/n*sp,ny=u.y+dy/n*sp;
      u.dir=Math.atan2(dy,dx);
      const w=t.air?null:hedgeAt(nx,ny,t.r);
      if(w&&w!==u.tgt)u.wall=w;else{u.x=nx;u.y=ny;u.moving=true}
    }else if(u.cd<=0){
      u.cd=t.rate/(A.rager>0?1.25:1);
      if(t.proj)A.projs.push({x:u.x,y:u.y,tx:cx,ty:cy,tgt,dmg:t.dmg*dmgM*bm,color:t.proj,spd:8,from:'a'});
      else{damageB(tgt,t.dmg*dmgM*bm*(t.lootMul&&isLoot(tgt)?t.lootMul:1));A.fx.push(u.k==='heavy'?{type:'ring',x:cx,y:cy,r:.9,t:.3,max:.3,color:'#fff3c4'}:{type:'pow',x:cx,y:cy,t:.15,max:.15})}
    }
  }
  for(let i=0;i<A.units.length;i++)for(let j=i+1;j<A.units.length;j++){
    const a=A.units[i],b=A.units[j];if(!T[a.k].air!==!T[b.k].air)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=T[a.k].r+T[b.k].r;
    if(d<m){const p=(m-d)*.25;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p}
  }
  for(const b of A.bs){
    if(b.hit>0)b.hit-=dt;
    const d=B[b.type];if(!b.alive||!d.def)continue;
    if(b.stun>0){b.stun-=dt;continue}
    b.cd-=dt;if(b.cd>0)continue;
    const c=center(b);let best=null,bd=d.range;
    for(const u of A.units){if(d.ground&&T[u.k].air)continue;const dd=Math.hypot(u.x-c.x,u.y-c.y)-T[u.k].r;if(dd<bd){bd=dd;best=u}}
    if(!best)continue;
    b.cd=d.rate;b.aim=Math.atan2(best.y-c.y,best.x-c.x);
    if(b.type==='speaker'){
      A.fx.push({type:'ring',x:c.x,y:c.y,r:d.range,t:.5,max:.5,color:'#c99bff'});
      for(const u of A.units)if(!T[u.k].air&&Math.hypot(u.x-c.x,u.y-c.y)<d.range){u.hp-=d.dmg[b.lvl-1];u.stun=Math.max(u.stun,d.stun)}
    }else A.projs.push({x:c.x,y:c.y,tx:best.x,ty:best.y,tgt:best,dmg:d.dmg[b.lvl-1],splash:d.splash||0,color:b.type==='balloon'?'#6fd8ff':'#ffa31a',spd:9,from:'d'});
  }
  for(const p of A.projs){
    const tg=p.tgt,alive=p.from==='a'?tg.alive:tg.hp>0;
    if(alive&&p.from==='d'){p.tx=tg.x;p.ty=tg.y}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),s=p.spd*dt;
    if(d<=s){
      p.done=true;
      if(p.from==='a'){if(alive)damageB(tg,p.dmg)}
      else{
        if(alive)tg.hp-=p.dmg;
        if(p.splash){for(const u of A.units)if(u!==tg&&!T[u.k].air&&Math.hypot(u.x-p.tx,u.y-p.ty)<p.splash)u.hp-=p.dmg*.6;A.fx.push({type:'ring',x:p.tx,y:p.ty,r:p.splash,t:.25,max:.25,color:'#6fd8ff'})}
      }
    }else{p.x+=dx/d*s;p.y+=dy/d*s}
  }
  A.projs=A.projs.filter(p=>!p.done);
  A.units=A.units.filter(u=>{if(u.hp<=0){A.lost++;A.fx.push({type:'pow',x:u.x,y:u.y,t:.25,max:.25});return false}return true});
  for(const f of A.fx)f.t-=dt;A.fx=A.fx.filter(f=>f.t>0);
  const left=inLoadout().some(k=>(G.army[k]||0)>0);
  if(A.endIn!=null)A.endIn-=dt;
  if(A.t<=0||(A.deployed>0&&!A.units.length&&!left)||(A.endIn!=null&&A.endIn<=0)){A.t=Math.max(0,A.t);finishMatch()}
  updateRaidHud();
}
// InMatch -> Results. Rewards are paid here and only here, so they land exactly once per match.
function finishMatch(){
  if(!Match.go('Results'))return;
  stopHold();
  const c=cap();
  const gd=Math.max(0,Math.min(Math.floor(A.base.loot.dues*A.pct/100),Math.floor(c-G.dues)));
  const gc=Math.max(0,Math.min(Math.floor(A.base.loot.clout*A.pct/100),Math.floor(c-G.clout)));
  G.dues+=gd;G.clout+=gc;
  const gg=A.stars*CFG.match.gemsPerStar;G.gems+=gg;
  let rep=A.stars?A.stars*8+Math.max(0,A.base.lvl-CL())*4:-5;
  const avenged=A.revenge&&A.stars>0;
  if(avenged){rep+=6;const e=G.log.find(x=>x.id===A.revenge.id);if(e)e.avenged=true}
  G.rep=Math.max(0,G.rep+rep);save();
  const won=A.stars>0,secs=Math.round(CFG.match.duration-A.t);
  A.result={won,dues:gd,clout:gc,gems:gg,rep};
  const st=[0,1,2].map(i=>i<A.stars?'★':'<span class="off">★</span>').join('');
  openSheet(`<div class="head"><h3 style="color:${won?'var(--gold)':'var(--danger)'}">${won?'Victory':'Defeat'}</h3></div>
    <div class="big-stars">${st}</div>
    <p style="text-align:center;margin:0;font-size:18px">${A.pct}% of ${A.base.name} destroyed${A.chapterDown?', Chapter House down':''}.</p>
    <div class="stats" style="justify-content:center"><span>Time <b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b></span><span>Troops sent <b>${A.deployed}</b></span><span>Troops lost <b>${A.lost}</b></span></div>
    <div class="loot"><span class="d">+${fmt(gd)} Dues</span><span class="c">+${fmt(gc)} Clout</span>${gg?`<span class="g">+${gg} Gems</span>`:''}</div>
    <p style="text-align:center;margin:0;color:var(--muted)">Rep ${rep>=0?'+':''}${rep}${avenged?' · Revenge served':''}</p>
    <button class="btn" id="lobbyBtn">Return to lobby</button>`,true);
  $('lobbyBtn').onclick=returnToLobby;
  renderAll();
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function shade(hex,f){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255],m=f<0?0:255,a=Math.abs(f);return`rgb(${c.map(v=>Math.round(v+(m-v)*a)).join(',')})`}
function poly(pts,fill){ctx.beginPath();pts.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function circ(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,7);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function heart(x,y,s,c){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.6,y-s*1.1,x,y-s*.3);ctx.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);ctx.fillStyle=c;ctx.fill()}
// a box seen from above at a slight angle: lit top face plus a darker front wall
function box(x,y,w,h,wall,top,col){rr(x,y+h-wall-2,w,wall+2,3);ctx.fillStyle=shade(col,-.4);ctx.fill();rr(x,y,w,h-wall,3);ctx.fillStyle=top||col;ctx.fill()}
const tick=()=>performance.now()/1000;

/* ---------- maps: ground texture is baked once per map, scenery is drawn live so buildings can cover it ---------- */
const mkRnd=s=>()=>(s=s*16807%2147483647)/2147483647;
function blob(g,rnd,x,y,r,col){g.beginPath();for(let i=0;i<10;i++){const a=i/10*6.283,k=r*(.7+rnd()*.35);i?g.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k*.75):g.moveTo(x+k,y)}g.closePath();g.fillStyle=col;g.fill()}
function blades(g,rnd,n,cols){g.lineWidth=.8;for(let i=0;i<n;i++){const x=rnd()*LOG,y=rnd()*LOG;g.strokeStyle=cols[rnd()*cols.length|0];g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*2.2,y-1.5-rnd()*2.5);g.stroke()}}
function dots(g,rnd,n,r,cols,alpha){g.globalAlpha=alpha;for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.beginPath();g.arc(rnd()*LOG,rnd()*LOG,r*(.6+rnd()*.6),0,7);g.fill()}g.globalAlpha=1}
const LAWN={tiles:['#1f3f2a','#234630'],vignette:.38,seed:11,count:34,decor:[['oak',3],['bush',4],['berry',2],['rock',1]]};
function lawnGround(g,rnd){
  for(let i=0;i<8;i++){const x=rnd()*LOG,y=rnd()*LOG,r=9+rnd()*14;blob(g,rnd,x,y,r,'rgba(96,72,42,.55)');blob(g,rnd,x+1,y-1,r*.6,'rgba(128,98,60,.35)');for(let j=0;j<6;j++){g.fillStyle='rgba(170,150,120,.5)';g.fillRect(x+(rnd()-.5)*r,y+(rnd()-.5)*r*.6,1.2,1.2)}}
  blades(g,rnd,1100,['rgba(130,200,120,.16)','rgba(5,25,12,.28)']);
  for(let i=0;i<40;i++){const x=rnd()*LOG,y=rnd()*LOG;for(const[a,b]of[[0,-1.2],[-1.1,.6],[1.1,.6]]){g.fillStyle='rgba(60,130,60,.45)';g.beginPath();g.arc(x+a,y+b,1.1,0,7);g.fill()}}
  dots(g,rnd,24,1.1,['#efe9cf','#f2c94c','#e88fb4'],.6);
}
let lawnCv=null,lawnScale=0;
function buildLawn(){
  const c=document.createElement('canvas');c.width=c.height=Math.round(LOG*scale);
  const g=c.getContext('2d');g.scale(scale,scale);
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){g.fillStyle=LAWN.tiles[(x+y)%2?0:1];g.fillRect(x*TS,y*TS,TS,TS)}
  lawnGround(g,mkRnd(LAWN.seed));
  const v=g.createRadialGradient(LOG/2,LOG/2,LOG*.3,LOG/2,LOG/2,LOG*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${LAWN.vignette})`);g.fillStyle=v;g.fillRect(0,0,LOG,LOG);
  lawnCv=c;lawnScale=scale;
}
const showingRival=()=>!!A&&(!inMenus()||page==='lobby');
function drawLawn(){if(!lawnCv||lawnScale!==scale)buildLawn();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(lawnCv,0,0);ctx.restore()}

// scenery sits mostly on the outer two rings of tiles, where buildings rarely go
let decorList=null;
function decorFor(){
  if(decorList)return decorList;
  const m=LAWN,rnd=mkRnd(m.seed*7+3),out=[],tot=m.decor.reduce((s,d)=>s+d[1],0);
  for(let i=0;i<600&&out.length<m.count;i++){
    let tx,ty;
    if(rnd()<.8){const e=rnd()*4|0,a=rnd()*GRID|0,b=rnd()<.5?0:1;[tx,ty]=e===0?[a,b]:e===1?[a,GRID-1-b]:e===2?[b,a]:[GRID-1-b,a]}
    else{tx=rnd()*GRID|0;ty=rnd()*GRID|0}
    const x=tx+.5+(rnd()-.5)*.5,y=ty+.6+(rnd()-.5)*.4;
    if(out.some(o=>Math.hypot(o.x-x,o.y-y)<1.2))continue;
    let p=rnd()*tot,k=m.decor[0][0];for(const[n,w]of m.decor){if((p-=w)<0){k=n;break}}
    out.push({k,x,y,v:rnd()});
  }
  return decorList=out;
}

      poly([[px-q,py+q*.6],[px-q*.3,py-q],[px+q,py-q*.2],[px+q*.6,py+q*.7]],i%3?'#4a4038':shade(d.color,-.3))}

  const k=o.bounce!=null?clamp(o.bounce/.35,0,1):1,sq=Math.sin(k*Math.PI*2)*(1-k)*.12;

  }

    const by=y-4+Math.sin(tick()*3+b.id)*1.5;

    ctx.fillStyle=d.gives==='dues'?PAL.dues:PAL.clout;ctx.beginPath();ctx.arc(x+w/2,by,8,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x+w/2,by-1,6,Math.PI*1.1,Math.PI*1.9);ctx.fill();

function renderBaseActions(){
  const due=G.log.filter(e=>e.stars>0&&!e.avenged).length;
  $('baseActions').innerHTML=`<div class="actions"><button class="btn ghost" id="buildBtn">Build</button><button class="btn ghost" id="rivBtn">Rivals${due?`<span class="badge">${due}</span>`:''}</button><button class="btn red" id="raidBtn">Raid</button></div>`;
  $('buildBtn').onclick=openBuild;$('rivBtn').onclick=()=>openRivals(false);$('raidBtn').onclick=()=>setPage('lobby');
}
function openBuild(){
  const rows=SHOP.map(t=>{
    const d=B[t],n=count(t),m=maxCount(t),cost=d.cost[0];
    const unlock=m===0?`Chapter LV ${d.max.findIndex(v=>v>0)+1}`:n>=m?'Max built':'';
    return`<div class="item"><div class="sw" style="background:#1f3f2a url(${bldIcon(t)}) center/cover"></div><div class="t"><b>${d.name} <small style="color:var(--muted)">${n}/${m}</small></b><span>${d.desc}</span></div>${unlock?`<div class="lock">${unlock}</div>`:costBtn('',d.res,cost,'b_'+t)}</div>`;
  }).join('');
  openSheet(`<div class="head"><h3>Build</h3><button class="btn ghost" id="closeS">Close</button></div>${rows}`);
  $('closeS').onclick=closeSheet;
  for(const t of SHOP){const el=$('b_'+t);if(el)el.onclick=()=>{
    const d=B[t];
    if(G[d.res]<d.cost[0]){toast(`You need ${fmt(d.cost[0]-G[d.res])} more ${resName(d.res)}.`);return}
    if(d.time[0]>0&&busyCount()>=2){toast('Both builders are busy. Wait for one to finish.');return}
    closeSheet();ui={sel:null,place:t,move:false,ghost:null};renderAll();
  }}
}
function ago(t){const m=(now()-t)/60000;return m<60?Math.max(1,Math.round(m))+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'}
function openRivals(report){
  const fresh=G.log.filter(e=>e.fresh);
  const rows=G.log.map(e=>{
    const st=[0,1,2].map(i=>i<e.stars?'★':'<span class="off">★</span>').join('');
    const loss=e.stars?`Took ${fmt(e.lost.dues)} Dues and ${fmt(e.lost.clout)} Clout`:'Your defenses held them off. +1 Gem';
    const act=e.stars===0?`<span class="won" style="font-family:var(--display);font-size:14px">Defended</span>`:e.avenged?`<span style="color:var(--muted);font-weight:700">Avenged</span>`:`<button class="btn red" data-rev="${e.id}">Revenge</button>`;
    return`<div class="logrow"><div><b>${e.name} <span class="stars" style="display:inline;font-size:13px">${st}</span></b><span>Level ${e.lvl} · ${ago(e.t)} · ${loss}. <span class="${e.rep>=0?'won':'lost'}" style="display:inline">Rep ${e.rep>=0?'+':''}${e.rep}</span></span></div>${act}</div>`}).join('');
  const head=report&&fresh.length?`While you were out, ${fresh.length===1?'a rival frat':fresh.length+' rival frats'} hit your lawn`:'Rivalry log';
  openSheet(`<div class="head"><h3>${head}</h3><button class="btn ghost" id="closeS">Close</button></div>
    ${rows||'<p>Nobody has raided you yet. Rivals strike while you are away, so build defenses before you log off. Every frat that hits you shows up here for revenge.</p>'}
    ${G.log.length?'<p style="font-size:14px">A Revenge raid sends you to the Lobby against that frat. You can win back what they took on top of the usual loot.</p>':''}`);
  for(const e of G.log)e.fresh=false;save();
  $('closeS').onclick=()=>{closeSheet();renderAll()};
  $('sheetCard').querySelectorAll('[data-rev]').forEach(el=>el.onclick=()=>{
    const e=G.log.find(x=>String(x.id)===el.dataset.rev);if(!e)return;
    closeSheet();findOpponent(e);setPage('lobby');
  });
}

function renderShop(){

$('shopGrid').addEventListener('click',e=>{const el=e.target.closest('[data-gift]');if(el)openGift(GIFTS.find(g=>g.id===el.dataset.gift))});
function openGift(g){
  const bal=G[g.cur],short=g.price-bal,block=g.check(),note=g.note?g.note():'';
  const msg=short>0?`<div class="warn">You need ${fmt(short)} more ${resName(g.cur)}.</div>`:block?`<div class="warn">${block}</div>`:note?`<p>${note}</p>`:'';
  openSheet(`<div class="head"><h3>Buy ${g.name}?</h3></div>
    <div class="confirm"><img src="${giftIcon(g)}" alt=""><p>${g.desc}</p>${priceTag(g.cur,g.price)}
      <div class="bal"><span>You have <b>${fmt(bal)} ${resName(g.cur)}</b></span>${short>0?'':`<span>After <b>${fmt(bal-g.price)}</b></span>`}</div>${msg}</div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" id="noBuy" style="flex:1">Cancel</button><button class="btn" id="yesBuy" style="flex:1" ${short>0||block?'disabled':''}>Buy</button></div>`);
  $('noBuy').onclick=closeSheet;
  $('yesBuy').onclick=()=>{
    if(G[g.cur]<g.price||g.check())return;
    G[g.cur]-=g.price;const got=g.apply();save();closeSheet();toast(`${g.name}: ${got}.`);renderAll();
  };
}

function renderTroops(){
  const lo=inLoadout();
  $('troopsSub').textContent=`Army ${armyUsed()}/${armyCap()} · Bringing ${lo.length}/${LOADOUT_MAX}`;
  const rows=Object.keys(T).map(k=>{
    const t=T[k],locked=CL()<t.unlock,sel=!locked&&lo.includes(k);
    return`<div class="trow ${sel?'sel':''} ${locked?'locked':''}"><img src="${troopIcon(k)}" alt="">
      <div><h3>${t.name}<small>×${G.army[k]||0}${t.max?'/'+t.max:''}</small></h3><p>${t.desc}</p>
        <div class="tstats"><span>Health <b>${t.hp}</b></span><span>Damage <b>${t.dmg}</b></span><span>Cost <b>${t.cost} C</b></span><span>Speed <b>${t.spd}</b></span><span>Range <b>${t.range<1?'Melee':t.range}</b></span><span>Space <b>${t.house}</b></span></div></div>
      <div class="tact">${locked?`<div class="lockreq">Unlocks at<br>Chapter LV ${t.unlock}</div>`
        :`<button class="btn ${sel?'':'ghost'}" data-pick="${k}" aria-pressed="${sel}">${sel?'✓ Bringing':'Bring'}</button>${costBtn('+1','clout',t.cost,'r_'+k,'ghost')}`}</div></div>`}).join('');
  const cl=closet();
  const prows=Object.keys(P).map(k=>{const p=P[k],lock=!cl?'Build a<br>Prank Closet':cl.lvl<p.unlock?`Unlocks at<br>Closet LV ${p.unlock}`:'';
    return`<div class="trow ${lock?'locked':''}"><div class="pi">${p.glyph}</div><div><h3>${p.name}<small>×${G.pranks[k]||0}</small></h3><p>${p.desc}</p><div class="tstats"><span>Cost <b>${p.cost} C</b></span><span>Radius <b>${p.r}</b></span></div></div>
      <div class="tact">${lock?`<div class="lockreq">${lock}</div>`:costBtn('+1','clout',p.cost,'p_'+k,'ghost')}</div></div>`}).join('');
  $('troopList').innerHTML=`<p style="margin:0;color:var(--muted);font-size:14px">Pick up to ${LOADOUT_MAX} troop types to bring into your next match. Recruit them with Clout.</p>${rows}<div class="sect">Pranks · ${prankUsed()}/${prankCap()} slots</div>${prows}`;
}
$('troopList').addEventListener('click',e=>{
  const pick=e.target.closest('[data-pick]'),btn=e.target.closest('button[id]');
  if(pick){
    const k=pick.dataset.pick,i=G.loadout.indexOf(k);
    if(i>=0)G.loadout.splice(i,1);
    else{G.loadout=inLoadout();if(G.loadout.length>=LOADOUT_MAX){toast(`You can bring ${LOADOUT_MAX} troop types. Drop one first.`);return}G.loadout.push(k)}
    save();renderTroops();return;
  }
  if(!btn)return;
  if(btn.id.startsWith('r_')){
    const k=btn.id.slice(2),t=T[k];
    if(t.max&&(G.army[k]||0)>=t.max){toast(`Only ${t.max} ${t.name} per army.`);return}
    if(armyUsed()+t.house>armyCap()){toast('Your Rush Tents are full. Upgrade or build another tent.');return}
    if(G.clout<t.cost){toast(`You need ${fmt(t.cost-G.clout)} more Clout.`);return}
    G.clout-=t.cost;G.army[k]=(G.army[k]||0)+1;save();renderTroops();
  }else if(btn.id.startsWith('p_')){
    const k=btn.id.slice(2),p=P[k];
    if(prankUsed()>=prankCap()){toast('Your Prank Closet is full. Upgrade it for more slots.');return}
    if(G.clout<p.cost){toast(`You need ${fmt(p.cost-G.clout)} more Clout.`);return}
    G.clout-=p.cost;G.pranks[k]=(G.pranks[k]||0)+1;save();renderTroops();
  }
});

/* ---------- match ---------- */
function renderMatch(){
  $('matchPanel').textContent=Match.state==='Ready'?'Get ready. Pick a troop below, then drop it on the open lawn once the match starts.':`${A.revenge?'Revenge on':'Raiding'} ${A.base.name}. Tap or hold open lawn to drop troops. Pranks land anywhere. Knock buildings down to build Hype, then throw a Rager.`;
  renderBottom();
}
function renderBottom(){
  const bt=$('bottom');
  const chips=inLoadout().filter(k=>(G.army[k]||0)>0||A.sel===k).map(k=>`<button class="chip ${A.sel===k?'on':''}" data-k="${k}"><span class="g" style="background:#22352a url(${troopIcon(k)}) center/cover"></span><span class="n">${T[k].name}</span><span class="c">×${G.army[k]||0}</span></button>`).join('')
    +Object.keys(P).filter(k=>(G.pranks[k]||0)>0||A.sel==='p:'+k).map(k=>`<button class="chip prank ${A.sel==='p:'+k?'on':''}" data-k="p:${k}"><span class="g">${P[k].glyph}</span><span class="n">${P[k].name}</span><span class="c">×${G.pranks[k]||0}</span></button>`).join('');
  const live=A.rager>0,full=!live&&A.hype>=100;
  bt.innerHTML=`<div class="troops"><button class="chip rager ${full?'full':''} ${live?'live':''}" id="ragerB" style="--h:${live?100:A.hype}"><span class="g">R</span><span class="n">Rager</span><span class="c">${live?Math.ceil(A.rager)+'s':Math.floor(A.hype)+'%'}</span></button>${chips||'<span style="color:var(--muted);padding:10px">No troops left.</span>'}<button class="chip" id="endB" style="border-color:#5a2a25"><span class="g" style="background:var(--danger);border-color:var(--danger-d)">✕</span><span class="n">End raid</span></button></div>`;
  bt.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{A.sel=el.dataset.k;renderBottom()});
  $('endB').onclick=finishMatch;$('ragerB').onclick=throwRager;
}

function syncAd(){$('ad').hidden=!adReady||adClosed||!inMenus()||page!=='base'}
$('adX').onclick=()=>{adClosed=true;clearInterval(adTimer);syncAd()};
$('adCta').onclick=()=>toast('This ad is a placeholder.');
setTimeout(()=>{adReady=true;showAd();syncAd();adTimer=setInterval(()=>{adI++;showAd()},12000)},1500);

/* ---------- navigation ---------- */
const PAGES=['base','shop','troops','lobby'];
function setPage(p){
  if(!inMenus())return;
  if(p!=='base'){ui.place=null;ui.move=false;ui.ghost=null}
  const changed=p!==page;page=p;renderAll();
  if(changed){const el=$('pg-'+p);el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter')}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setPage(t.dataset.page));
function renderAll(){
  const match=!inMenus();
  $('hud').hidden=match;$('ahud').hidden=!match;$('tabs').hidden=match;
  for(const p of[...PAGES,'match'])$('pg-'+p).hidden=match?p!=='match':p!==page;
  document.querySelectorAll('.tab').forEach(t=>t.dataset.page===page?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
  const wrap=match?'wrap-match':page==='base'?'wrap-base':page==='lobby'?'wrap-lobby':null;
  if(wrap&&cv.parentNode!==$(wrap))$(wrap).appendChild(cv);
  if(match)renderMatch();
  else if(page==='base'){renderPanel();renderBaseActions()}
  else if(page==='shop')renderShop();
  else if(page==='troops')renderTroops();
  else renderLobby();
  hudKey='';updateHud();updateRaidHud();syncAd();fit();
}

/* ---------- input ---------- */
function tileAt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*GRID,y:(e.clientY-r.top)/r.height*GRID}}
let hold=null,holdPos=null;
const onBase=()=>inMenus()&&page==='base';
cv.addEventListener('pointermove',e=>{
  const p=tileAt(e);holdPos=p;
  const gt=ui.place||(ui.move&&ui.sel&&ui.sel.type);
  if(onBase()&&gt){const s=B[gt].size;ui.ghost={x:clamp(Math.round(p.x-s/2),0,GRID-s),y:clamp(Math.round(p.y-s/2),0,GRID-s)}}
});
cv.addEventListener('pointerdown',e=>{
  const p=tileAt(e);holdPos=p;
  if(Match.state==='InMatch'){
    deployAt(p.x,p.y);clearInterval(hold);
    if(A&&A.sel&&A.sel.startsWith('p:'))return;
    hold=setInterval(()=>{if(holdPos)deployAt(holdPos.x,holdPos.y)},140);
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    return;
  }
  if(!onBase())return;
  const gt=ui.place||(ui.move&&ui.sel&&ui.sel.type);
  if(gt){
    const s=B[gt].size,x=clamp(Math.round(p.x-s/2),0,GRID-s),y=clamp(Math.round(p.y-s/2),0,GRID-s);
    ui.ghost={x,y};
    if(ui.move){
      if(fits(x,y,s,G.buildings,ui.sel)){ui.sel.x=x;ui.sel.y=y;ui.move=false;ui.ghost=null;ui.bounce={b:ui.sel,t:tick()};save();renderAll()}else toast('That spot is taken.');
    }else if(placeNew(gt,x,y)){
      ui.bounce={b:G.buildings[G.buildings.length-1],t:tick()};
      if(gt==='hedge'&&count('hedge')<maxCount('hedge')&&G.dues>=B.hedge.cost[0])renderPanel();
      else{ui.place=null;ui.ghost=null;renderAll()}
    }
    return;
  }
  const tx=Math.floor(p.x),ty=Math.floor(p.y);
  const hit=G.buildings.find(b=>{const s=B[b.type].size;return tx>=b.x&&tx<b.x+s&&ty>=b.y&&ty<b.y+s});
  if(hit){ui.bounce={b:hit,t:tick()};if(B[hit.type].gives&&stored(hit)>=1)collect(hit)}
  ui.sel=hit||null;renderAll();
});
function stopHold(){clearInterval(hold);hold=null}
cv.addEventListener('pointerup',stopHold);cv.addEventListener('pointercancel',stopHold);cv.addEventListener('pointerleave',stopHold);

/* ---------- sizing & loop ---------- */
// the board fills the largest square its page leaves free
let fitKey='';
function fit(){
  const w=cv.parentNode,r=w.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const s=Math.floor(Math.min(r.width,r.height)),dpr=window.devicePixelRatio||1,key=s+'@'+dpr;
  if(key===fitKey)return;fitKey=key;
  cv.style.width=s+'px';cv.style.height=s+'px';cv.width=Math.round(s*dpr);cv.height=Math.round(s*dpr);scale=cv.width/LOG;
}
window.addEventListener('resize',fit);
let last=performance.now(),acc=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(Match.state==='Ready')tickReady(dt);
  else if(Match.state==='InMatch')stepRaid(dt);
  for(const f of floats)f.t-=dt*.9;floats=floats.filter(f=>f.t>0);
  tweenHud(dt);if(inMenus())updateHud();
  acc+=dt;
  if(acc>.5){acc=0;
    if(inMenus()){finishBuilds();
      document.querySelectorAll('[data-until]').forEach(el=>el.textContent=ftime((+el.dataset.until-now())/1000));
      const r=$('readyV');if(r&&ui.sel)r.textContent=fmt(stored(ui.sel));}
  }
  if(cv.isConnected&&!cv.parentNode.closest('[hidden]'))draw();
  requestAnimationFrame(loop);
}
finishBuilds();renderAll();requestAnimationFrame(loop);
if(document.fonts)document.fonts.ready.then(()=>{fitKey='';fit()});
processAway();
setInterval(()=>{if(!document.hidden)G.seen=now();save()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)processAway()});
})();
</script>
